[package]
name = "terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "POS register terminal"
authors = ["Omar Sweiti"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jiff.workspace = true
pos-domain.workspace = true
# The print worker (1.7.7) is where the register's store and its printer first
# meet: it leases jobs from `pos-db`'s receipt queue and sends their bytes
# through `pos-hardware`'s printer trait. Neither crate is new to the workspace,
# and the terminal enables no feature of either — `emulator` and `fixtures` are
# developers' tools, and two tests hold the shipped graph to that.
pos-db.workspace = true
pos-hardware.workspace = true
# The worker owns its transactions, so it names the connection type.
rusqlite.workspace = true
# A queued artifact's bytes are checked against their stored digest before they
# leave for a printer (`ref/hardware-and-receipts.md` §1).
blake3.workspace = true
# Ids arrive as `Uuid` from an `IdSource` and are written as their bytes.
uuid.workspace = true
# Every log line passes through the scrubbing layer (1.6.8). Both are already
# the workspace's.
tracing.workspace = true
tracing-subscriber.workspace = true
# A failure's trace id is random, from the same OS source as the database key.
getrandom.workspace = true
# Wipes the recovery code a new register shows once (1.8.5b).
zeroize.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The registered chain a sale completes against, shared with `pos-db`'s own
# suites. A dev-dependency's features never reach a build that ships.
pos-db = { workspace = true, features = ["fixtures"] }
# 1.7.14's binding is proven against 1.7.12's emulated printer, as its `Done
# when` asks. The same rule holds: a dev-dependency's features never reach a
# build that ships, and `the_register_bundle_never_enables_the_emulator` reads
# the terminal's graph without its dev-dependencies to hold it to that.
pos-hardware = { workspace = true, features = ["emulator"] }
# The queue must survive a restart, so one test reopens a database file.
tempfile.workspace = true
# 1.8.4's recovery property restarts a register at every step a checkout can
# be cut at, under the shared I/O case count and recorded seed.
proptest.workspace = true
pos-test-support.workspace = true
