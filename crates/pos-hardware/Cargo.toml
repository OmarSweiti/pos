[package]
name = "pos-hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
# The renderer's input. `ref/hardware-and-receipts.md` §2.4 puts the boundary
# here in as many words: *"the renderer lives at `pos-hardware`'s printer
# boundary and is fed a `ReceiptModel` built in `pos-domain`"*. The edge runs
# one way — nothing in `pos-domain` knows this crate exists, which is what keeps
# that crate pure (I-8).
pos-domain.workspace = true
# The receipt raster pipeline (1.7.3). See the workspace manifest for why the
# shaper is `harfrust` and the font reader is `skrifa`, rather than the
# `cosmic-text` the phase file names or the `rustybuzz`/`ttf-parser` pair that
# two RUSTSEC unmaintained advisories retired.
harfrust.workspace = true
skrifa.workspace = true
unicode-bidi.workspace = true
tiny-skia.workspace = true
# One division, once: `tiny-skia` needs an `f32` scale from font units to
# pixels, and `float_arithmetic` is `forbid` workspace-wide, so the ratio is
# computed on `Decimal` and converted at the boundary. Everything else in the
# pipeline is `i32`. `rust_decimal` is already in the workspace graph, so this
# adds no supply-chain surface — see `render::raster`.
rust_decimal.workspace = true
# Device profiles are data (1.7.11): versioned JSON files under `profiles/`,
# read here and by the register's web tests alike, which is why the format is
# JSON rather than TOML. Both crates are already in the workspace graph through
# `pos-domain`, so this adds no supply-chain surface.
serde.workspace = true
serde_json.workspace = true
# The emulated printer's PNG pages (1.7.12) — only with the `emulator` feature.
png = { workspace = true, optional = true }

[features]
# The emulated network printer (1.7.12): a developer's and CI's tool, never
# product. Nothing a register ships enables it, and
# `the_register_bundle_never_enables_the_emulator` holds the terminal to that.
emulator = ["dep:png"]

[[bin]]
name = "escpos-emulator"
path = "src/bin/escpos-emulator.rs"
required-features = ["emulator"]

[dev-dependencies]
# The test fixture builds typed ids, which are newtypes over `Uuid`.
uuid.workspace = true
proptest.workspace = true
pos-test-support.workspace = true
# The committed hash per profile version that makes an edit in place fail
# (1.7.11). The workspace's one hash, already a dependency of `pos-domain`.
blake3.workspace = true
# This crate's own tests run with the emulator, so `just test` and CI exercise
# 1.7.12 without a flag anyone has to remember. A dev-dependency's features
# never reach a build that ships (resolver 3), which the bundle test checks.
pos-hardware = { path = ".", features = ["emulator"] }
