[package]
name = "pos-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate's first binary target (microstep 1.6.6b). Declared rather than left
# to Cargo's `src/bin/` inference: a target that exists because of where a file
# sits is a target nobody reviewing this manifest can see, and `--bin
# verify-audit` is in a `Done when` line and in the Phase-1 exit gate.
#
# It takes no dependency of its own. Two flags and `--help` are parsed by hand,
# so no argument-parser crate enters the graph that `pos-db` puts on a register,
# and `Cargo.lock` does not move.
[[bin]]
name = "verify-audit"
path = "src/bin/verify-audit.rs"

[dependencies]
blake3.workspace = true
rusqlite.workspace = true
keyring.workspace = true
getrandom.workspace = true
# Repositories return owned domain values. The capability grid this crate's
# migration seeds also remains declared once in `pos_domain::permissions`.
pos-domain.workspace = true
# `AuditIntent.payload` is a `serde_json::Value` and `audit_log.payload` is
# canonical JSON by DDL, so the audit repository cannot read a row back
# without it (microstep 1.6.6). Already a runtime dependency of
# `pos-domain`, so nothing new enters the register binary's graph.
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
