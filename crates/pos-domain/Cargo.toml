[package]
name = "pos-domain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
rust_decimal.workspace = true

[dev-dependencies]
proptest.workspace = true
# Tests only, and the reason it is not in [dependencies] is invariant I-8: this
# crate reads `PROPTEST_CASES` from the environment, which a pure crate may not
# do. As a dev-dependency it is compiled for the test target and is absent from
# the register binary, so purity is untouched — the same argument that lets
# serde_json in below. It holds the one shared case count, seed and
# regression-persistence policy (conventions §5.1) so no property in this crate
# can quietly choose a cheaper one.
pos-test-support.workspace = true
# Tests only. `Currency` hand-writes Serialize/Deserialize so the exponent stays
# off the wire, and that cannot be tested without a concrete format. Ships
# nothing: purity (I-8) governs what reaches a register, and a dev-dependency
# never does. See ref/domain-api.md's dependency allowlist.
serde_json.workspace = true
