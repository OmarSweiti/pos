[workspace]
resolver = "3"
members = [
  "crates/pos-domain",
  "crates/pos-db",
  "crates/pos-sync",
  "crates/pos-hardware",
  "apps/server",
  "apps/terminal/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The real floor of the locked graph, not the edition minimum. sqlx 0.9 and its
# five sibling crates declare 1.94.0; edition 2024 alone would only need 1.85,
# which is what this said while the graph had already moved nine releases past
# it. Recompute after a dependency bump with:
#   cargo metadata --format-version 1 | jq -r '.packages[].rust_version' | sort -V
rust-version = "1.94"
# Proprietary and never published to crates.io. Both facts are load-bearing for
# the supply-chain gate: `publish = false` is what lets deny.toml skip our own
# crates in the licence audit and permit workspace path dependencies.
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
# A register handles money and runs unattended in a shop. Nothing we write needs
# to opt out of the borrow checker; dependencies still may, and this does not
# constrain them. `forbid` rather than `deny` so it cannot be lifted by a local
# allow attribute — if hardware FFI ever genuinely needs it, that is a reviewed
# change to this line, not a quiet annotation in a file nobody is reading.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A panic in a register is a lost sale. Tests and main() opt out locally.
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "warn"
# conventions I-1: no float ever touches money.
float_arithmetic = "deny"
todo             = "warn"
dbg_macro        = "deny"

[workspace.dependencies]
# ── shared internal crates ──────────────────────────────────────────────
pos-domain   = { path = "crates/pos-domain" }
pos-db       = { path = "crates/pos-db" }
pos-sync     = { path = "crates/pos-sync" }
pos-hardware = { path = "crates/pos-hardware" }

# ── core ────────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
uuid         = { version = "1", default-features = false, features = ["serde"] }
rust_decimal = "1"

# ── data ────────────────────────────────────────────────────────────────
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
# The OS CSPRNG, for the SQLCipher key. Not `rand`: this needs one call and no
# distributions, and a key generator should have the shortest path to the OS.
getrandom = "0.4"
keyring  = "4"
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "derive", "macros",
] }
# ── server / async ──────────────────────────────────────────────────────
tokio              = { version = "1", features = ["full"] }
axum               = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── testing ─────────────────────────────────────────────────────────────
proptest = "1"
tempfile = "3"
