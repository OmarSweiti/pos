[workspace]
resolver = "3"
members = [
  "crates/pos-domain",
  "crates/pos-db",
  "crates/pos-sync",
  "crates/pos-hardware",
  "crates/pos-test-support",
  "apps/server",
  "apps/terminal/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# This is an unpublished application, not a library with a separately supported
# MSRV. Keep the package contract equal to the compiler CI actually proves in
# rust-toolchain.toml; claiming an untested lower floor makes Cargo/Clippy
# decisions look supported when they are not. Bump both pins together.
rust-version = "1.97.1"
# Proprietary and never published to crates.io. Both facts are load-bearing for
# the supply-chain gate: `publish = false` is what lets deny.toml skip our own
# crates in the licence audit and permit workspace path dependencies.
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
# A register handles money and runs unattended in a shop. Nothing we write needs
# to opt out of the borrow checker; dependencies still may, and this does not
# constrain them. `forbid` rather than `deny` so it cannot be lifted by a local
# allow attribute — if hardware FFI ever genuinely needs it, that is a reviewed
# change to this line, not a quiet annotation in a file nobody is reading.
unsafe_code = "forbid"

[workspace.lints.clippy]
# A panic in a register is a lost sale. Tests and main() opt out locally.
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
indexing_slicing = "warn"
# conventions I-1: no float ever touches money.
float_arithmetic = "deny"
todo             = "warn"
dbg_macro        = "deny"

[workspace.dependencies]
# ── shared internal crates ──────────────────────────────────────────────
pos-domain   = { path = "crates/pos-domain" }
pos-db       = { path = "crates/pos-db" }
pos-sync     = { path = "crates/pos-sync" }
pos-hardware = { path = "crates/pos-hardware" }
# Test support only. It reads the environment and returns a proptest config, so
# it belongs in a [dev-dependencies] table and nowhere else — see conventions §5.1.
pos-test-support = { path = "crates/pos-test-support" }

# ── core ────────────────────────────────────────────────────────────────
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
uuid         = { version = "1", default-features = false, features = ["serde"] }
rust_decimal = "1"
# Shell-only IANA time-zone resolution. The always-bundled database makes
# business-date conversion use the same shipped rules on every register OS;
# this dependency must never be added to pure `pos-domain` (I-8).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

# ── data ────────────────────────────────────────────────────────────────
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
# The OS CSPRNG, for the SQLCipher key. Not `rand`: this needs one call and no
# distributions, and a key generator should have the shortest path to the OS.
getrandom = "0.4"
keyring  = "4"
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate", "derive", "macros",
] }
# ── server / async ──────────────────────────────────────────────────────
tokio              = { version = "1", features = ["full"] }
axum               = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── testing ─────────────────────────────────────────────────────────────
proptest = "1"
tempfile = "3"
# Compile-fail testing. A typed id whose whole purpose is that the compiler
# refuses `f(line_id, sale_id)` can only be proved by a test that fails to
# compile, and an ordinary #[test] cannot express that. Dev-only, so it reaches
# no register: purity (I-8) governs what ships, and a dev-dependency never does.
trybuild = "1"
