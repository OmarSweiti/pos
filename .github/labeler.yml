# Path → label, applied by .github/workflows/labeler.yml.
# Labels you have to remember to add are labels nobody adds.

"area: domain":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-domain/**" }]
"area: db":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-db/**" }]
"area: sync":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-sync/**" }]
"area: hardware":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-hardware/**" }]
"area: terminal":
  - changed-files: [{ any-glob-to-any-file: "apps/terminal/**" }]
"area: server":
  - changed-files: [{ any-glob-to-any-file: "apps/server/**" }]
"area: backoffice":
  - changed-files: [{ any-glob-to-any-file: "apps/backoffice/**" }]
"area: repo":
  - changed-files:
      - any-glob-to-any-file:
          - "justfile"
          - "scripts/**"
          - ".github/**"
          - ".githooks/**"
          - ".claude/**"
          - "Cargo.toml"
          - "package.json"
          - "biome.json"
          - "rust-toolchain.toml"
          - "pnpm-workspace.yaml"
          - "infra/**"
# NOTE: no `type:` rules here on purpose. The type is the first word of the PR
# title, not a property of the files touched — `docs/**` matches nearly every PR
# in this repository because §4.13 requires the contradicted docs to be fixed in
# the same commit, so a path-derived `type: docs` was applied almost always and
# meant almost nothing. scripts/pr-type-label.sh reads it from the title instead.
# `area:` and `risk:` stay below, where a glob genuinely is the right evidence.

"area: impl":
  - changed-files: [{ any-glob-to-any-file: "docs/implementation/**" }]

# The three that change how a PR is reviewed, not merely where it lands.
"risk: migration":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/pos-db/migrations/**"
          - "apps/server/migrations/**"
"risk: money path":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/pos-domain/src/money*"
          - "crates/pos-domain/src/tax*"
          - "crates/pos-domain/src/cart*"
          - "crates/pos-domain/src/discount*"
"risk: security":
  - changed-files:
      - any-glob-to-any-file:
          - "**/auth*"
          - "**/crypto*"
          - "**/secret*"
          - "docs/implementation/ref/security-compliance.md"
