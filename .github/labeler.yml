# Path → label, applied by .github/workflows/labeler.yml.
# Labels you have to remember to add are labels nobody adds.

"area: domain":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/pos-domain/**"
          - "packages/money/**"
"area: db":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-db/**" }]
"area: sync":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-sync/**" }]
"area: hardware":
  - changed-files: [{ any-glob-to-any-file: "crates/pos-hardware/**" }]
"area: fiscal":
  - changed-files:
      - any-glob-to-any-file:
          - "**/fiscal/**"
          - "**/jofotara/**"
          - "**/*fiscal*"
          - "docs/implementation/ref/fiscal-jofotara.md"
          - "docs/implementation/ref/tax-jordan.md"
"area: terminal":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/terminal/**"
          - "packages/ui/**"
          - "packages/api-types/**"
"area: server":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/server/**"
          - "packages/api-types/**"
"area: backoffice":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/backoffice/**"
          - "packages/ui/**"
          - "packages/api-types/**"
"area: repo":
  - changed-files:
      - any-glob-to-any-file:
          - "justfile"
          - "scripts/**"
          - ".github/**"
          - ".githooks/**"
          - ".claude/**"
          - ".codex/**"
          - ".agents/**"
          - ".gitattributes"
          - ".gitignore"
          - ".gitleaks.toml"
          - "AGENTS.md"
          - "CLAUDE.md"
          - "Cargo.toml"
          - "Cargo.lock"
          - "README.md"
          - "SECURITY.md"
          - "deny.toml"
          - "package.json"
          - ".nvmrc"
          - "pnpm-lock.yaml"
          - "biome.json"
          - "rust-toolchain.toml"
          - "pnpm-workspace.yaml"
          - "infra/**"
# NOTE: no `type:` rules here on purpose. The type is the first word of the PR
# title, not a property of the files touched — `docs/**` matches nearly every PR
# in this repository because §4.13 requires the contradicted docs to be fixed in
# the same commit, so a path-derived `type: docs` was applied almost always and
# meant almost nothing. scripts/pr-type-label.sh reads it from the title instead.
# `area:` and `risk:` stay below, where a glob genuinely is the right evidence.

"area: impl":
  - changed-files: [{ any-glob-to-any-file: "docs/implementation/**" }]

# These change how a PR is reviewed, not merely where it lands.
"risk: migration":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/pos-db/migrations/**"
          - "apps/server/migrations/**"
          - "scripts/verify-schema.py"
          - "scripts/verify-pg-migrations.py"
          - "scripts/rust_lexer.py"
"risk: money path":
