version: 2

# Grouped and monthly on purpose. A money system does not want a daily stream of
# single-crate bumps: each one is a diff somebody has to actually read, and an
# unread dependency bump is how a supply-chain problem arrives politely.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    groups:
      rust-patch:
        applies-to: version-updates
        update-types: ["patch"]
      rust-minor:
        applies-to: version-updates
        update-types: ["minor"]
    ignore:
      # The toolchain is pinned in rust-toolchain.toml and moved deliberately (§13).
      - dependency-name: "rust-toolchain"

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    groups:
      js-patch:
        applies-to: version-updates
        update-types: ["patch"]
      js-minor:
        applies-to: version-updates
        update-types: ["minor"]
    ignore:
      # @types/node's major must equal the pinned Node runtime major: .nvmrc and
      # package.json pin the runtime, pnpm-workspace.yaml pins the override, and
      # scripts/check-node-version.py refuses a mismatch. A major bump here can
      # never go green, so proposing one only manufactures work that policy must
      # reject — PR #24 was closed red on four checks for exactly this. The Node
      # runtime moves deliberately, and the typings follow it in that same change.
      # Same-major updates are not ignored and still flow normally.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    groups:
      actions:
        patterns: ["*"]

  # Docker Compose is its own supported ecosystem; the generic `docker`
  # ecosystem does not discover image references in compose files.
  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    ignore:
      # A PostgreSQL major upgrade also requires a reviewed data-upgrade plan,
      # PGDATA/mount review, and matching CI/verifier pins. Keep routine patch
      # and minor refreshes automatic; move majors deliberately.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
