version: 2

# Grouped and monthly on purpose. A money system does not want a daily stream of
# single-crate bumps: each one is a diff somebody has to actually read, and an
# unread dependency bump is how a supply-chain problem arrives politely.
#
# Every update is assigned to the owner, whose approving review the
# code-owner-review ruleset requires before any of these can merge. The review
# itself is requested by .github/CODEOWNERS: GitHub removed this file's
# `reviewers` key in May 2025 in favour of code owners, and `assignees` is the
# supported way left to route the pull request to a person.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"]
    groups:
      rust-patch:
        applies-to: version-updates
        update-types: ["patch"]
      rust-minor:
        applies-to: version-updates
        update-types: ["minor"]
    ignore:
      # The toolchain is pinned in rust-toolchain.toml and moved deliberately (§13).
      - dependency-name: "rust-toolchain"

  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"]
    groups:
      js-patch:
        applies-to: version-updates
        update-types: ["patch"]
      js-minor:
        applies-to: version-updates
        update-types: ["minor"]
    ignore:
      # @types/node is part of the Node runtime contract, not a library: .nvmrc
      # and package.json pin the runtime, pnpm-workspace.yaml pins the typings
      # with an override, both apps' package.json must equal that override, and
      # scripts/check-node-version.py and the branch-workflow policy refuse any
      # disagreement. Dependabot edits package.json but never the pnpm override,
      # so no update it proposes can go green, at any version. PR #24, a major,
      # was closed red on four checks. PR #347, a minor (24.13.3 → 24.19.2),
      # declared one version while installing another, failed three checks,
      # and stranded the four other bumps in its group. So none is proposed:
      # the Node runtime moves deliberately, and the typings follow it in that
      # same change (docs/implementation/02-development-workflow.md §13).
      - dependency-name: "@types/node"

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"]
    # Split by update type, like cargo and npm above, rather than one grouped PR
    # carrying every pinned action. A single group is atomic: one bump that can
    # never go green strands the other fourteen for a month, and PR #24 is the
    # precedent — closed red on four checks because one major could not pass the
    # Node pin. A setup-node or pnpm/action-setup major is exactly that shape,
    # since scripts/check-node-version.py reconciles .nvmrc, package.json, the
    # pnpm override *and* every setup-node workflow step, so the action bump and
    # the runtime move have to land as one deliberate change.
    #
    # Only version updates are grouped here. Dependabot security updates are
    # enabled repository-side and arrive as their own ungrouped pull request, so
    # a real advisory is never waiting behind a monthly patch or minor batch.
    groups:
      actions-patch:
        applies-to: version-updates
        update-types: ["patch"]
      actions-minor:
        applies-to: version-updates
        update-types: ["minor"]

  # Docker Compose is its own supported ecosystem; the generic `docker`
  # ecosystem does not discover image references in compose files.
  - package-ecosystem: docker-compose
    directory: "/infra"
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 3
    target-branch: development
    commit-message:
      prefix: "chore(repo)"
    labels: ["type: chore", "area: repo", "meta: dependencies"]
    assignees: ["OmarSweiti"]
    ignore:
      # A PostgreSQL major upgrade also requires a reviewed data-upgrade plan,
      # PGDATA/mount review, and matching CI/verifier pins. Keep routine patch
      # and minor refreshes automatic; move majors deliberately.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
