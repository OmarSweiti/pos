name: Microstep
description: One numbered unit of work from a phase file — the normal way work enters this repo.
title: "[<phase>.<group>.<step>] "
labels: ["type: feat"]
body:
  - type: markdown
    attributes:
      value: |
        A microstep is the commit unit; a **group** is the branch and PR unit.
        If this work is not in a phase file yet, add it there first — the phase files are the
        plan of record, not this issue.
  - type: input
    id: step
    attributes:
      label: Microstep number
      description: "`<phase>.<group>.<step>` — stable, and referenced from commit messages."
      placeholder: "1.3.4"
    validations:
      required: true
  - type: input
    id: phase-file
    attributes:
      label: Phase file and heading
      placeholder: "docs/implementation/phase-1-sellable-mvp.md § 1.3.4"
    validations:
      required: true
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      description: Microsteps that must land first. "None" is a valid answer.
      placeholder: "1.3.1, 1.1.2"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Every file this will create or change. A file that appears here late is a scope leak.
      placeholder: |
        crates/pos-domain/src/tax.rs   (new)
        docs/implementation/ref/domain-api.md  (§4, if the signature moves)
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests to add
      description: Exact test names. `<subject>_<behaviour>` for examples, `prop_<invariant>` for properties.
      placeholder: |
        inclusive_16pct_extracts_exactly
        prop_line_tax_sum_equals_receipt_tax
    validations:
      required: true
  - type: input
    id: verify
    attributes:
      label: Verify
      description: The command that proves it. Not a description of the command.
      placeholder: "cargo nextest run -p pos-domain tax::"
    validations:
      required: true
  - type: input
    id: done-when
    attributes:
      label: Done when
      description: One objectively checkable sentence. Not "the tax engine works".
      placeholder: "Σ line tax == receipt tax, exactly, ∀ inputs"
    validations:
      required: true
  - type: input
    id: catalog
    attributes:
      label: Test-catalog rows closed
      description: "`E.n` rows from ref/test-catalog.md. Write `none` if it closes none."
      placeholder: "E.18, E.19"
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants this touches
      description: conventions §1. Checking one is not a warning — it selects the review priority.
      options:
        - label: "I-1 money is i64 minor units; no float, one rounding"
        - label: "I-2 the minor-unit exponent is per-currency data"
        - label: "I-3 quantities are i64 milli-units"
        - label: "I-4 completed sales are immutable"
        - label: "I-5 price and name are copied onto the sale line"
        - label: "I-6 stock is a ledger; on-hand is a rebuildable cache"
        - label: "I-7 ordering comes from server versions and UUIDv7"
        - label: "I-8 pos-domain is pure — time and IDs are arguments"
        - label: "I-9 every fact write and its outbox row share one transaction"
