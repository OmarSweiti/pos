name: branch-flow

# No branch protection or ruleset is configured, so no check is a merge wall.
# This workflow therefore makes violations visible and logged, but it cannot
# prevent the repository administrator from merging a red check.
# Paid-plan enforcement is intentionally out of scope.
#
# `pull_request_target` is load-bearing here: GitHub reads this workflow from the
# trusted default-branch definition, so a PR cannot remove the evaluating job. The
# token is read-only and no repository secret is referenced. Executable policy
# comes only from `github.workflow_sha`, the exact commit that supplied this
# trusted workflow definition. The PR base/head SHAs remain comparison data.

on: # zizmor: ignore[dangerous-triggers] read-only token; exact head is data and only workflow-revision policy executes
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out policy from the exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize the verified untrusted head as data only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" || {
            echo "::error::event base SHA is not present in the trusted repository clone"
            exit 1
          }
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --no-recurse-submodules origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          unset auth_header
          fetched=$(git rev-parse "refs/remotes/pull/$PR_NUMBER/head^{commit}")
          [ "$fetched" = "$HEAD_SHA" ] || {
            echo "::error::fetched PR head $fetched does not match event head $HEAD_SHA"
            exit 1
          }
          candidate_root="$RUNNER_TEMP/candidate"
          [ ! -e "$candidate_root" ] || {
            echo "::error::candidate worktree path already exists"
            exit 1
          }
          git -c core.hooksPath=/dev/null -c submodule.recurse=false \
            worktree add --detach "$candidate_root" "$HEAD_SHA"
          [ "$(git -C "$candidate_root" rev-parse HEAD)" = "$HEAD_SHA" ] || {
            echo "::error::candidate worktree is not the verified event head"
            exit 1
          }

      - name: The next workflow retains this trusted-workflow boundary
        env:
          TRUSTED_POLICY_SHA: ${{ github.workflow_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          policy="$GITHUB_WORKSPACE/scripts/check-branch-workflow-policy.rb"
          [ -f "$policy" ] || {
            echo "::error::trusted workflow revision lacks scripts/check-branch-workflow-policy.rb"
            exit 1
          }
          candidate_root="$RUNNER_TEMP/candidate"
          ruby "$policy" \
            --candidate-root "$candidate_root" \
            --trusted-revision "$TRUSTED_POLICY_SHA" \
            --candidate-revision "$HEAD_SHA"

      - name: No PR may edit a source plan or an existing migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/check-protected-paths.sh" \
            "$BASE_SHA" "$HEAD_SHA"

      - name: PR commits contain no assistant-attribution trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          verifier="$GITHUB_WORKSPACE/scripts/check-automation-attribution.py"
          commits="$RUNNER_TEMP/pr-commits.txt"
          git rev-list "$BASE_SHA..$HEAD_SHA" > "$commits"
          while IFS= read -r commit; do
            [ -n "$commit" ] || continue
            "$verifier" --git-commit "$commit"
          done < "$commits"

      - name: GitHub automation uses only approved full-SHA actions
        run: |
          set -euo pipefail
          candidate_root="$RUNNER_TEMP/candidate"
          GH_ACTIONS_POLICY_ROOT="$candidate_root" \
            "$GITHUB_WORKSPACE/scripts/gh-actions-policy.sh" --check

  topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out policy from the exact trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      # Title, body, and branch names go through env, never through expressions
      # embedded in shell source. All validators come from the workflow revision.
      - name: A PR must flow feature → development → staging → main
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/scripts/validate-branch-flow.sh" \
            "$HEAD_REF" "$BASE_REF" "$HEAD_REPO" "$BASE_REPO"

      - name: PR title is the squash commit message, so it obeys conventions §8
        env:
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            development|staging|main|hotfix/*)
              echo "promotion, back-merge, or hotfix PR — merged with a merge commit, so the title is free text. Skipping."
              exit 0 ;;
          esac
          "$GITHUB_WORKSPACE/scripts/validate-change-title.sh" "$TITLE"

      - name: PR title and body contain no assistant attribution
        env:
          TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/pr-title-and-body.txt"
          printf '%s\n%s' "$TITLE" "$PR_BODY" > "$message_file"
          "$GITHUB_WORKSPACE/scripts/check-automation-attribution.py" \
            --message-file "$message_file"

  # Promotion PRs must use merge commits. CI cannot choose the merge button, so
  # this read-only job makes the required choice prominent on the PR.
  promotion-notice:
    if: github.head_ref == 'development' || github.head_ref == 'staging' || github.head_ref == 'main' || startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warn that this PR must use a merge commit
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "::warning::Non-squash PR ($HEAD_REF → $BASE_REF) — use 'Create a merge commit'. A squash here permanently forks the branches."
