name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest

    # Present from day one: the first server test should not also be a CI
    # debugging session (phase-0-closeout.md 0.2.1).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pos"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux system deps (the src-tauri crate is a workspace member)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      # Reads rust-toolchain.toml — no floating `stable`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace

      # pos-domain's module graph is acyclic by design (ref/domain-api.md §15).
      # NOT cargo-modules --acyclic: its graph is item-level, so any constructor
      # returning Self reads as a cycle. This checks modules, which is the rule.
      - name: Domain crate must stay acyclic
        run: ./scripts/check-domain-acyclic.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # reads "packageManager" from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci --error-on-warnings .
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build

      # The implementation docs are only worth their cross-references.
      - name: Documentation links resolve
        run: ./scripts/check-doc-links.sh
