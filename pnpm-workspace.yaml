packages:
  - apps/terminal
  - apps/backoffice
  - packages/*

# pnpm 11 gates post-install scripts through `allowBuilds`, as an explicit
# per-package decision — `onlyBuiltDependencies` is the pnpm 10 spelling and no
# longer governs an install. Anything not named here has its build script
# silently skipped, and a fresh install then FAILS with ERR_PNPM_IGNORED_BUILDS.
# esbuild's postinstall fetches its platform binary; without it, vite cannot run.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true

# Resolve and validate dependency engines against the same exact runtime used by
# CI, even when `pnpm install` happens to be launched by a newer system Node.
# The root project's own `engines` field is always enforced by pnpm; this
# additional setting makes incompatible dependency engines fatal as well.
nodeVersion: 24.19.0
engineStrict: true

# Keep every optional peer chosen by Vite/Vitest on the runtime's declaration
# major, including workspace packages that do not import Node APIs themselves.
overrides:
  "@types/node": 24.13.3
