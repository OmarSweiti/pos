packages:
  - apps/terminal
  - apps/backoffice
  - packages/*

# pnpm 11 gates post-install scripts through `allowBuilds`, as an explicit
# per-package decision — `onlyBuiltDependencies` is the pnpm 10 spelling and no
# longer governs an install. Anything not named here has its build script
# silently skipped, and a fresh install then FAILS with ERR_PNPM_IGNORED_BUILDS.
# esbuild's postinstall fetches its platform binary; without it, vite cannot run.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true

# `engines` in package.json is advisory on its own: pnpm prints a warning and
# installs anyway. This makes the declared Node range binding, so a machine on
# the wrong line is refused at install rather than discovered at build.
engineStrict: true
